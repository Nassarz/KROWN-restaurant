<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Crown -->
  <g transform="translate(256,190)">
    <!-- Crown base -->
    <path d="M-120,40 L-120,-10 L-80,20 L-40,-30 L0,10 L40,-30 L80,20 L120,-10 L120,40 Z" fill="url(#crown)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <!-- Crown jewels -->
    <circle cx="-80" cy="5" r="8" fill="#ef4444"/>
    <circle cx="0" cy="-5" r="10" fill="#ef4444"/>
    <circle cx="80" cy="5" r="8" fill="#ef4444"/>
    <!-- Crown base band -->
    <rect x="-120" y="34" width="240" height="16" rx="4" fill="#fff" opacity="0.9"/>
  </g>
  <!-- K letter -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="160" fill="#fff" letter-spacing="-8">K</text>
  <!-- Text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="42" fill="#fff" letter-spacing="8" opacity="0.9">KROWN</text>
  <text x="256" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="24" fill="#fff" letter-spacing="12" opacity="0.7">ERP</text>
</svg>
